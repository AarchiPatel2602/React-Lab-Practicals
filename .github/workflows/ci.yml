name: CI/CD Pipeline

on:
  push:
    branches: [ main, demo-ci-failure ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend & Root Dependencies
        run: npm install

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Run Backend API Tests
        run: |
          cd backend
          npm test

      - name: Run Frontend Build Verification
        run: npm run build
